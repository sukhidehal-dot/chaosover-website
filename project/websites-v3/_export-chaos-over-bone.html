<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Export — Chaos Over · Primary stacked on bone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1C1822;
    --ink-soft: rgba(28,24,34,0.65);
    --bone: #F4EEE2;
    --bone-2: #EDE5D4;
    --lime: #C8FF3D;
    --line: rgba(28,24,34,0.12);
  }
  html, body { margin: 0; padding: 0; background: #F4EEE2; }
  body { width: 1600px; height: 1200px; overflow: hidden; }
  /* Export frame — fixed pixel size so the JPEG comes out crisp & consistent */
  .export {
    width: 1600px; height: 1200px;
    background: var(--bone-2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-sizing: border-box;
  }
  .wm-big {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 900;
    font-size: 460px; line-height: 0.82; letter-spacing: -0.025em;
    color: var(--ink);
    text-align: center;
  }
  .wm-big .strike-line { position: relative; display: inline-block; }
  .wm-big .strike-line::after {
    content: ''; position: absolute; left: -6%; right: -6%; top: 72%;
    height: 0.04em; background: var(--lime);
    transform: translateY(-50%) rotate(-39deg);
    transform-origin: center;
  }
  .wm-big .dot { color: var(--lime); }
  .wm-caption {
    position: absolute; bottom: 44px; left: 56px;
    font-family: 'JetBrains Mono', monospace; font-size: 22px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="export" id="export">
    <div class="wm-big"><span class="strike-line">CHAOS</span><br/><span class="strike-line">OVER</span><span class="dot">.</span></div>
    <span class="wm-caption">[ Primary · stacked · on bone ]</span>
  </div>
</body>
</html>

  function setStatus(msg) { if (loading) loading.textContent = msg; }

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

ocked wordmark (matches the live tweak saved in the brand canvas) */\n.co-wordmark { font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; line-height: 0.84; letter-spacing: -0.02em; color: var(--ink); }\n.co-wordmark .strike-line { position: relative; display: inline-block; }\n.co-wordmark .strike-line::after {\n  content: ''; position: absolute; left: -6%; right: -6%; top: 72%;\n  height: 0.04em; background: var(--lime);\n  transform: translateY(-50%) rotate(-39deg);\n  transform-origin: center;\n}\n.co-wordmark .dot { color: var(--lime); }\n\n/* Lime fill highlight — used everywhere acid lime touches type.\n   Uses a gradient clip so the lime sits behind the *visual* letterforms\n   only, instead of the full em box — prevents the block bleeding into the\n   line above when line-height is tight. */\n.lime-fill {\n  background: linear-gradient(\n    to bottom,\n    transparent 0%, transparent 16%,\n    var(--lime) 16%, var(--lime) 92%,\n    transparent 92%, transparent 100%\n  );\n  color: var(--ink); padding: 0 .12em;\n  box-decoration-break: clone; -webkit-box-decoration-break: clone;\n}\n\n/* Mono eyebrow tag, lime-fill style */\n.eyebrow-tag {\n  display: inline-block; background: var(--lime); color: var(--ink);\n  font-family: 'JetBrains Mono', monospace;\n  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n  padding: 4px 9px;\n}\n\n/* Dark + lime card pair (lifted from the In-the-Wild Web Hero) */\n.card-ink, .card-lime {\n  padding: 22px; display: flex; flex-direction: column; justify-content: space-between;\n  min-height: 220px;\n}\n.card-ink { background: var(--ink); color: var(--bone); }\n.card-ink .meta { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.6; }\n.card-ink h4 { font-family: 'Big Shoulders Display'; font-weight: 900; font-size: 30px; letter-spacing: -0.02em; line-height: 0.95; }\n.card-lime { background: var(--lime); color: var(--ink); }\n.card-lime .meta { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.7; }\n.card-lime h4 { font-family: 'Big Shoulders Display'; font-weight: 900; font-size: 30px; letter-spacing: -0.02em; line-height: 0.95; }\n\n/* CTA buttons */\n.btn {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 14px 22px;\n  font-family: 'JetBrains Mono'; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;\n  border-radius: 999px; border: 0; cursor: pointer; text-decoration: none;\n  transition: transform .2s, background .2s, color .2s, border-color .2s;\n}\n.btn-ink { background: var(--ink); color: var(--bone); }\n.btn-ink:hover { background: var(--lime); color: var(--ink); }\n.btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); padding: 12.5px 20.5px; }\n.btn-outline:hover { background: var(--ink); color: var(--bone); }\n.btn-lime { background: var(--lime); color: var(--ink); }\n.btn-lime:hover { transform: translateY(-2px); }\n\n/* Reveal */\n[data-reveal] { opacity: 0; transform: translateY(40px); transition: opacity 1.1s cubic-bezier(.2,.7,.3,1), transform 1.1s cubic-bezier(.2,.7,.3,1); }\n[data-reveal].in { opacity: 1; transform: translateY(0); }\n[data-reveal-delay=\"1\"] { transition-delay: .08s; }\n[data-reveal-delay=\"2\"] { transition-delay: .16s; }\n[data-reveal-delay=\"3\"] { transition-delay: .24s; }\n[data-reveal-delay=\"4\"] { transition-delay: .32s; }\n\n/* Top meta strip */\n.meta-strip {\n  display: flex; justify-content: space-between; align-items: center;\n  padding: 14px 40px; border-bottom: 1px solid var(--line);\n  font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n  color: var(--ink-soft); background: transparent;\n}\n.meta-strip .lime-dot { color: var(--lime); -webkit-text-stroke: 0.6px var(--ink); }\n\n/* Footer */\nfooter.foot {\n  padding: 28px 40px; border-top: 1px solid var(--line);\n  display: flex; justify-content: space-between; align-items: center;\n  font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n  color: var(--ink-soft);\n}\n\n/* Standard container */\n.container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }\n<\u002Fstyle>\n\n<style>\n  /* Avinyr-inspired tactical: bracket labels, plain language. Petal 3-color gradient ground. */\n\n  /* Petal gradient — same as Brand canvas \"VS 03e · Petal (3-color)\".\n     Applied to body (overriding the flat bone in co-soft.css), fixed so it\n     stays viewport-sized as the page scrolls. */\n  body {\n    background:\n      radial-gradient(110% 90% at 95% 5%, #e6dcf3 0%, rgba(230,220,243,0) 60%),\n      radial-gradient(110% 90% at 5% 95%, #fbe2e9 0%, rgba(251,226,233,0) 60%),\n      #f9f3ea;\n    background-attachment: fixed;\n  }\n\n  .nav {\n    position: sticky; top: 0; z-index: 50;\n    background: rgba(249,243,234,0.55); backdrop-filter: blur(18px) saturate(160%);\n    border-bottom: 1px solid var(--line);\n  }\n  .nav-inner { display: flex; justify-content: space-between; align-items: center; padding: 14px 40px; gap: 32px; }\n  .nav .logo { font-family: 'Big Shoulders Display'; font-weight: 900; font-size: 20px; letter-spacing: -0.02em; }\n  .nav .logo .dot { color: var(--lime); }\n  .nav ul { list-style: none; display: flex; gap: 26px; }\n  .nav a.link { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.7; }\n  .nav a.link:hover { opacity: 1; }\n  .nav .nav-cta { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; padding: 10px 16px; }\n\n  /* HERO */\n  .hero {\n    padding: 60px 40px 80px;\n    min-height: 92vh;\n    display: flex; flex-direction: column; justify-content: space-between;\n  }\n  .hero .eyebrow-tag { margin-bottom: 60px; }\n  .hero h1.title { font-size: clamp(110px, 14vw, 220px); }\n  .hero .strap {\n    margin-top: 36px;\n    font-family: 'Big Shoulders Display'; font-weight: 800;\n    font-size: clamp(36px, 4.4vw, 72px); line-height: 1.05; letter-spacing: -0.02em;\n    max-width: 1100px;\n  }\n  .hero .strap .lime-fill { background: var(--lime); color: var(--ink); padding: 0 .08em; }\n  .hero .body {\n    margin-top: 30px; max-width: 720px;\n    font-size: 19px; line-height: 1.55; color: var(--ink-soft);\n  }\n  .hero .actions { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }\n\n  /* Stats row */\n  .stats {\n    margin-top: 80px; padding-top: 32px;\n    border-top: 1.5px solid var(--ink);\n    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;\n  }\n  .stat {\n    padding: 0 24px 0 0;\n    display: flex; flex-direction: column; gap: 4px;\n    border-right: 1px solid var(--line);\n  }\n  .stat:last-child { border-right: 0; }\n  .stat + .stat { padding-left: 24px; }\n  .stat .big {\n    font-family: 'Big Shoulders Display'; font-weight: 900;\n    font-size: clamp(72px, 9vw, 140px); line-height: 0.84; letter-spacing: -0.025em;\n  }\n  .stat .big .dot { color: var(--lime); }\n  .stat .label {\n    font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--ink-soft); margin-top: 4px;\n  }\n\n  /* Section header — clean single-column, no hanging numbers */\n  .section-head {\n    margin-bottom: 50px; padding-bottom: 22px;\n    border-bottom: 1.5px solid var(--ink);\n  }\n  .section-head h2 {\n    font-family: 'Big Shoulders Display'; font-weight: 900;\n    font-size: clamp(48px, 6.5vw, 96px); line-height: 0.9; letter-spacing: -0.02em;\n  }\n  .section-head .ref { margin-top: 10px; font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }\n\n  section { padding: 200px 0; }\n\n  /* Big intro statement that follows a section head */\n  .section-intro {\n    font-family: 'Big Shoulders Display'; font-weight: 800;\n    font-size: clamp(28px, 3.4vw, 52px); line-height: 1.1; letter-spacing: -0.015em;\n    max-width: 1100px; margin-bottom: 60px;\n  }\n  .section-intro .lime-fill { background: var(--lime); color: var(--ink); padding: 0 .1em; }\n\n  /* PILLARS — stacked horizontal cards */\n  .pillars { display: flex; flex-direction: column; gap: 14px; }\n  .pillar {\n    background: rgba(237, 229, 212, 0.9); padding: 32px; border: 1px solid var(--line);\n    display: grid; grid-template-columns: 90px 1fr 1.6fr; gap: 36px; align-items: start;\n    transition: background .25s, border-color .25s, transform .25s;\n  }\n  .pillar:hover { background: var(--ink); color: var(--bone); transform: translateY(-2px); }\n  .pillar:hover .pillar-num { color: var(--lime); }\n  .pillar:hover .pillar-text { color: rgba(244,238,226,0.78); }\n  .pillar-num { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; color: var(--lime); }\n  .pillar-title { font-family: 'Big Shoulders Display'; font-weight: 900; font-size: clamp(28px, 3vw, 44px); letter-spacing: -0.02em; line-height: 0.95; }\n  .pillar-text { font-size: 16px; line-height: 1.6; color: var(--ink-soft); }\n\n  /* WHO THIS IS FOR — headline + checklist split */\n  .who-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 60px; align-items: start; }\n  .who-grid .lede h3 {\n    font-family: 'Big Shoulders Display'; font-weight: 900;\n    font-size: clamp(40px, 5vw, 72px); line-height: 0.95; letter-spacing: -0.02em; margin-bottom: 24px;\n  }\n  .who-grid .lede h3 .lime-fill { background: var(--lime); color: var(--ink); padding: 0 .12em; }\n  .who-grid .lede p { font-size: 17px; line-height: 1.6; color: var(--ink-soft); }\n  .who-grid .lede p + p { margin-top: 16px; }\n  .who-grid .lede .small-label { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lime); -webkit-text-stroke: 0.4px var(--ink); margin-bottom: 24px; display: block; }\n\n  .checklist { display: flex; flex-direction: column; }\n  .check {\n    display: grid; grid-template-columns: 40px 1fr; gap: 18px; align-items: start;\n    padding: 18px 0; border-top: 1px solid var(--line);\n    transition: background .25s;\n  }\n  .check:hover { background: rgba(200,255,61,0.05); padding-left: 8px; }\n  .check:last-child { border-bottom: 1px solid var(--line); }\n  .check .arrow {\n    font-family: 'Big Shoulders Display'; font-weight: 900; font-size: 24px;\n    color: var(--lime); -webkit-text-stroke: 0.5px var(--ink); line-height: 1;\n  }\n  .check .body { font-size: 16px; line-height: 1.5; color: var(--ink); }\n\n  .who-disclaim {\n    margin-top: 60px; padding: 28px 32px;\n    background: rgba(237, 229, 212, 0.9); border: 1px dashed var(--line);\n    display: grid; grid-template-columns: 200px 1fr; gap: 36px; align-items: start;\n  }\n  .who-disclaim .label { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }\n  .who-disclaim .text { font-size: 15px; line-height: 1.55; color: var(--ink); }\n  .who-disclaim .text strong { color: var(--ink); }\n\n  /* WHY WE EXIST — 4 blocks in 2x2 grid + founder quote */\n  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n  .why-block {\n    background: rgba(237, 229, 212, 0.9); padding: 32px; border: 1px solid var(--line);\n    display: flex; flex-direction: column; gap: 14px;\n  }\n  .why-block .num { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; color: var(--lime); -webkit-text-stroke: 0.4px var(--ink); }\n  .why-block h4 { font-family: 'Big Shoulders Display'; font-weight: 900; font-size: 32px; letter-spacing: -0.02em; line-height: 1; }\n  .why-block .punchline { font-family: 'Big Shoulders Display'; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }\n  .why-block p { font-size: 15px; line-height: 1.6; color: var(--ink-soft); }\n\n  .founder-block {\n    margin-top: 60px;\n    background: var(--ink); color: var(--bone); padding: 48px;\n    display: grid; grid-template-columns: 200px 1fr; gap: 40px; align-items: start;\n  }\n  .founder-block .portrait {\n    aspect-ratio: 4/5;\n    background: linear-gradient(150deg, #3a3540 0%, #2a2730 100%);\n    border-radius: 4px;\n    box-shadow: 0 8px 24px rgba(28,24,34,0.18);\n  }\n  .founder-block .head .name {\n    font-family: 'Big Shoulders Display'; font-weight: 900;\n    font-size: 28px; letter-spacing: -0.015em; margin-bottom: 4px;\n  }\n  .founder-block .head .role { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--lime); -webkit-text-stroke: 0.4px transparent; }\n  .founder-block .quote {\n    margin-top: 24px;\n    font-family: 'Big Shoulders Display'; font-weight: 700;\n    font-size: clamp(22px, 2.2vw, 32px); line-height: 1.25; letter-spacing: -0.01em;\n  }\n  .founder-block .quote .lime { color: var(--lime); }\n  .founder-block .bio { margin-top: 24px; font-size: 15px; line-height: 1.6; color: rgba(244,238,226,0.78); padding-top: 24px; border-top: 1px solid rgba(244,238,226,0.16); }\n\n  /* SERVICES — 3 detailed cards */\n  .svc { display: flex; flex-direction: column; gap: 18px; }\n  .service {\n    background: rgba(237, 229, 212, 0.9); border: 1px solid var(--line);\n    padding: 40px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 48px;\n    transition: border-color .25s, transform .25s;\n  }\n  .service:hover { border-color: var(--ink); transform: translateY(-3px); }\n  .service .left .num { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; color: var(--lime); -webkit-text-stroke: 0.4px var(--ink); margin-bottom: 14px; }\n  .service .left h3 { font-family: 'Big Shoulders Display'; font-weight: 900; font-size: clamp(40px, 4.4vw, 64px); letter-spacing: -0.02em; line-height: 0.95; margin-bottom: 6px; }\n  .service .left .sub { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 24px; }\n  .service .left .tagline {\n    font-family: 'Big Shoulders Display'; font-weight: 700;\n    font-size: clamp(22px, 2vw, 30px); line-height: 1.2; letter-spacing: -0.01em;\n    margin-bottom: 18px;\n  }\n  .service .left .tagline .lime-fill { background: var(--lime); color: var(--ink); padding: 0 .1em; }\n  .service .left .body { font-size: 16px; line-height: 1.6; color: var(--ink); }\n  .service .left .body p + p { margin-top: 14px; }\n  .service .right { display: flex; flex-direction: column; gap: 14px; }\n  .service .right .label { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }\n  .service .right ul { list-style: none; display: flex; flex-direction: column; gap: 0; }\n  .service .right li {\n    font-size: 15px; line-height: 1.5;\n    padding: 12px 0; border-top: 1px solid var(--line);\n    display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start;\n  }\n  .service .right li:last-child { border-bottom: 1px solid var(--line); }\n  .service .right li::before {\n    content: '→'; font-family: 'Big Shoulders Display'; font-weight: 900;\n    color: var(--lime); -webkit-text-stroke: 0.4px var(--ink); font-size: 18px; line-height: 1.4;\n  }\n  .service .right .format {\n    margin-top: 8px; padding: 14px 16px;\n    background: var(--ink); color: var(--bone);\n    font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n  }\n  .service .right .format strong { color: var(--lime); font-weight: 700; -webkit-text-stroke: 0.4px transparent; }\n\n  /* SIGNAL STRIP */\n  .signal {\n    background: rgba(237, 229, 212, 0.9);\n    padding: 100px 40px;\n    border-top: 1.5px solid var(--ink);\n    border-bottom: 1.5px solid var(--ink);\n  }\n  .signal-inner {\n    max-width: 1280px; margin: 0 auto;\n    display: grid; grid-template-columns: 1.4fr 1fr; gap: 60px; align-items: center;\n  }\n  .signal h3 {\n    font-family: 'Big Shoulders Display'; font-weight: 900;\n    font-size: clamp(40px, 6vw, 84px); line-height: 0.95; letter-spacing: -0.02em;\n  }\n  .signal h3 .lime-fill { background: var(--lime); color: var(--ink); padding: 0 .1em; }\n  .signal p { font-size: 16px; line-height: 1.6; color: var(--ink); margin-bottom: 24px; }\n  .signal .right { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }\n\n  /* CONTACT */\n  .contact-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; align-items: start; }\n  .contact-meta { display: flex; flex-direction: column; gap: 24px; }\n  .contact-meta .row { padding-bottom: 16px; border-bottom: 1px solid var(--line); }\n  .contact-meta .row .label { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); display: block; margin-bottom: 8px; }\n  .contact-meta .row .value { font-family: 'Big Shoulders Display'; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }\n  .contact-meta .row .value a { color: var(--ink); text-decoration: none; }\n  .contact-meta .row .value a:hover { border-bottom: 2px solid var(--lime); }\n  .contact-meta .pre { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); }\n\n  .contact-form { display: flex; flex-direction: column; gap: 14px; }\n  .contact-form label {\n    font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--ink-soft); margin-bottom: 6px; display: block;\n  }\n  .contact-form input, .contact-form select, .contact-form textarea {\n    background: transparent; border: 0; border-bottom: 1.5px solid var(--ink);\n    padding: 12px 4px; color: var(--ink);\n    font-family: 'Space Grotesk', sans-serif; font-size: 16px; width: 100%;\n    border-radius: 0;\n  }\n  .contact-form input:focus, .contact-form select:focus, .contact-form textarea:focus {\n    outline: none; border-color: var(--lime);\n  }\n  .contact-form textarea { min-height: 110px; resize: vertical; }\n  .contact-form .field { display: flex; flex-direction: column; gap: 4px; }\n  .contact-form button {\n    align-self: flex-start; margin-top: 20px; padding: 18px 32px;\n    background: var(--ink); color: var(--bone); border: 0; cursor: pointer;\n    font-family: 'JetBrains Mono'; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;\n    border-radius: 999px; transition: background .2s;\n  }\n  .contact-form button:hover { background: var(--lime); color: var(--ink); }\n\n  /* Mobile */\n  @media (max-width: 900px) {\n    .hero .strap, .section-head h2 { font-size: 44px; }\n    .pillar, .service { grid-template-columns: 1fr; gap: 16px; }\n    .who-grid, .why-grid, .signal-inner, .contact-grid, .founder-block { grid-template-columns: 1fr; gap: 36px; }\n    .stats { grid-template-columns: 1fr; gap: 12px; }\n    .stat { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px 0; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"ambient-field\" id=\"ambient\"><\u002Fdiv>\n\n<div class=\"stage\">\n\n<div class=\"meta-strip\">\n  <div>CO/01 · <span style=\"color:var(--lime);\">●<\u002Fspan> &nbsp;Commercial strategy for agency founders<\u002Fdiv>\n  <div>\n<\u002Fdiv>\n  <div>EST. 2026 · London, UK<\u002Fdiv>\n<\u002Fdiv>\n\n<nav class=\"nav\">\n  <div class=\"nav-inner\">\n    <div class=\"logo\">Chaos Over<span class=\"dot\">.<\u002Fspan><\u002Fdiv>\n    <ul>\n      <li><a class=\"link\" href=\"#who-its-for\">Who it's for<\u002Fa><\u002Fli>\n      <li><a class=\"link\" href=\"#why\">Why we exist<\u002Fa><\u002Fli>\n      <li><a class=\"link\" href=\"#services\">Services<\u002Fa><\u002Fli>\n      <li><a class=\"link\" href=\"#contact\">Contact<\u002Fa><\u002Fli>\n    <\u002Ful>\n    <a href=\"#contact\" class=\"btn btn-ink nav-cta\">Book a Chaos Scan →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- HERO -->\n<section class=\"hero\">\n  <div>\n    <div class=\"eyebrow-tag\">▌ Commercial strategy for agency founders<\u002Fdiv>\n    <h1 class=\"display title\">\n      <span class=\"co-wordmark\"><span class=\"strike-line\">CHAOS<\u002Fspan><br><span class=\"strike-line\">OVER<\u002Fspan><span class=\"dot\">.<\u002Fspan><\u002Fspan>\n    <\u002Fh1>\n    <p class=\"strap\" data-reveal=\"\">New business doesn't have to feel <span class=\"lime-fill\">this hard<\u002Fspan>.<\u002Fp>\n    <p class=\"body\" data-reveal=\"\" data-reveal-delay=\"1\">If growth is inconsistent, pipeline is founder-dependent, and your proposition means different things to different people — the problem isn't effort. It's the system underneath.<\u002Fp>\n    <div class=\"actions\" data-reveal=\"\" data-reveal-delay=\"2\">\n      <a class=\"btn btn-ink\" href=\"#contact\">Book a Chaos Scan →<\u002Fa>\n      <a class=\"btn btn-outline\" href=\"#what-we-do\">See how it works<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stats\" data-reveal=\"\" data-reveal-delay=\"3\">\n    <div class=\"stat\">\n      <div class=\"big\">20+.<\u002Fdiv>\n      <div class=\"label\">Years inside agencies<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"big\">3<span class=\"dot\">.<\u002Fspan><\u002Fdiv>\n      <div class=\"label\">Clear ways to work together<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat\">\n      <div class=\"big\">1<span class=\"dot\">.<\u002Fspan><\u002Fdiv>\n      <div class=\"label\">Founder who's been in the room<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- [01] WHAT WE DO -->\n<section class=\"container\" id=\"what-we-do\" style=\"padding: 25px 40px 0px; opacity: 1.51\">\n  <div class=\"section-head\" data-reveal=\"\">\n    <h2>What we do<span style=\"color:var(--lime)\">.<\u002Fspan><\u002Fh2>\n    <div class=\"ref\">The proposition<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"section-intro\" data-reveal=\"\">We go in, find what's actually broken, and build the commercial system your team can run without you.&nbsp;<\u002Fp>\n\n  <div class=\"pillars\">\n    <div class=\"pillar\" data-reveal=\"\" style=\"border-radius: 5px; opacity: 2.5\">\n      <div class=\"pillar-num\">01<\u002Fdiv>\n      <div>\n        <div class=\"pillar-title\">We start with the diagnosis<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pillar-text\">Most agency founders are too close to their own business to see it clearly. We're not. A half-day or full-day Chaos Scan tells you what's actually holding you back — not what's easy to say.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pillar\" data-reveal=\"\" data-reveal-delay=\"1\" style=\"border-radius: 5px; opacity: 1\">\n      <div class=\"pillar-num\">02<\u002Fdiv>\n      <div>\n        <div class=\"pillar-title\">We build something real<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pillar-text\">Not a strategy deck that lives in a drawer. A working commercial system — proposition, pipeline, process — built around your team, your clients, and the way your market actually buys.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pillar\" data-reveal=\"\" data-reveal-delay=\"2\" style=\"border-radius: 5px; opacity: 18.23; text-align: left\">\n      <div class=\"pillar-num\">03<\u002Fdiv>\n      <div>\n        <div class=\"pillar-title\">Your team owns it<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pillar-text\">That's the whole point. Not dependency on us. Not another consultant who needs to be there for it to work. A commercial engine your people can run and improve. Then we step back.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"pillar\" data-reveal=\"\" data-reveal-delay=\"3\" style=\"border-radius: 5px\">\n      <div class=\"pillar-num\">04<\u002Fdiv>\n      <div>\n        <div class=\"pillar-title\">We stay close if you need us<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pillar-text\" style=\"opacity: 1\">Some founders want a thinking partner long-term. Someone who knows their business, challenges the assumptions, and calls out what's slipping. We can do that too — on a retainer, not a project.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- [02] WHO THIS IS FOR -->\n<section class=\"container\" id=\"who-its-for\" style=\"padding: 55px 40px 0px\">\n  <div class=\"section-head\" data-reveal=\"\" style=\"padding: 1px 0px 22px\">\n    <h2>Who this is for<span style=\"color:var(--lime)\">.<\u002Fspan><\u002Fh2>\n    <div class=\"ref\">The fit<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"who-grid\">\n    <div class=\"lede\" data-reveal=\"\">\n      <span class=\"small-label\">▌ The honest version<\u002Fspan>\n      <h3 style=\"line-height: 1\">Good at the work. <span class=\"lime-fill\">Frustrated<\u002Fspan> by the growth.<\u002Fh3>\n      <p>You built something real. 10 to 50 people. A team that delivers. Clients who come back. But new business still feels harder than it should — and if you're honest, too much of it runs through you.<\u002Fp>\n      <p>That's not a talent problem. It's a commercial system problem. And it's fixable.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"checklist\" data-reveal=\"\" data-reveal-delay=\"1\">\n      <div class=\"check\"><div class=\"arrow\">→<\u002Fdiv><div class=\"body\">You're the agency founder or MD — the one the pipeline runs through, whether you want it to or not<\u002Fdiv><\u002Fdiv>\n      <div class=\"check\"><div class=\"arrow\">→<\u002Fdiv><div class=\"body\">Revenue is inconsistent. A good month stops you from doing new business. A quiet month brings the Sunday dread back<\u002Fdiv><\u002Fdiv>\n      <div class=\"check\"><div class=\"arrow\">→<\u002Fdiv><div class=\"body\">Your proposition is muddy — you know you do good work, but you can't always explain it clearly, and neither can your team<\u002Fdiv><\u002Fdiv>\n      <div class=\"check\"><div class=\"arrow\">→<\u002Fdiv><div class=\"body\">You win work reactively. When it comes in, great. When it doesn't, there's no clear engine to turn to<\u002Fdiv><\u002Fdiv>\n      <div class=\"check\"><div class=\"arrow\">→<\u002Fdiv><div class=\"body\">You're between 10 and 50 people — past survival stage, not yet at the point where commercial is properly systematised<\u002Fdiv><\u002Fdiv>\n      <div class=\"check\"><div class=\"arrow\">→<\u002Fdiv><div class=\"body\">You've had the strategy conversations before. What you haven't had is someone who helps you actually build the thing<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"who-disclaim\" data-reveal=\"\" style=\"opacity: 1; border-radius: 5px\">\n    <div class=\"label\">[ Not for everyone ]<\u002Fdiv>\n    <div class=\"text\">If you're looking for someone to do the selling for you, or if you want a strategy deck and nothing else — we're probably not the right fit. We work with founders who are ready to look hard at what's actually going on and do something about it.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- [03] WHY WE EXIST -->\n<section class=\"container\" id=\"why\" style=\"padding: 55px 40px 0px\">\n  <div class=\"section-head\" data-reveal=\"\">\n    <h2>Why we exist<span style=\"color:var(--lime)\">.<\u002Fspan><\u002Fh2>\n    <div class=\"ref\">Built from 20 years in the room<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"section-intro\" data-reveal=\"\">Not 20 years advising agencies. 20 years <span class=\"lime-fill\">building, scaling, merging, and un-merging<\u002Fspan>. Chaos Over is the result of learning, painfully, what actually works.<\u002Fp>\n\n  <div class=\"why-grid\">\n    <div class=\"why-block\" data-reveal=\"\" style=\"border-radius: 5px\">\n      <span class=\"num\">01 / The pattern<\u002Fspan>\n      <h4>Most agency growth is accidental.<\u002Fh4>\n      <p>Work comes in through relationships. Through the founder's reputation. Through luck. That's not a commercial strategy — it's a vulnerability. When the founder steps back, when referrals dry up, when a key client leaves, there's nothing structural underneath to hold it.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"why-block\" data-reveal=\"\" data-reveal-delay=\"1\" style=\"border-radius: 5px\">\n      <span class=\"num\">02 / The problem with most advice<\u002Fspan>\n      <h4>Strategy without execution is expensive therapy.<\u002Fh4>\n      <p>We've watched founders sit through two-day offsites, pay consultants to produce positioning documents, and walk away with nothing that changes. Not because the thinking was wrong. Because nobody stayed to build the thing. That's what we do differently.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"why-block\" data-reveal=\"\" data-reveal-delay=\"2\" style=\"border-radius: 5px\">\n      <span class=\"num\">03 / What we know<\u002Fspan>\n      <h4>Growth feels harder when the market can't read you clearly.<\u002Fh4>\n      <p>Proposition, pipeline, proof, and process — when these four things work together, new business stops feeling random. When they don't, founders find themselves in the same conversations, winning inconsistently, working harder than the results justify.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"why-block\" data-reveal=\"\" data-reveal-delay=\"3\" style=\"border-radius: 5px\">\n      <span class=\"num\">04 / The name<\u002Fspan>\n      <h4>The name is a promise.<\u002Fh4>\n      <p>Chaos Over. Not chaos eliminated — that's not agency life. But chaos made manageable. Pattern recognised. System built. The feeling that things work differently now. That's what we're here to deliver.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"founder-block\" data-reveal=\"\" style=\"border-radius: 5px\">\n    <div class=\"portrait\"><\u002Fdiv>\n    <div>\n      <div class=\"head\">\n        <div class=\"name\">Sukhi Dehal<\u002Fdiv>\n        <div class=\"role\">Founder, Chaos Over<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"quote\">\"I've been inside the chaos. I know the Sunday dread. I know what it feels like to be the reason your agency can't grow without you. <span class=\"lime\">Chaos Over is everything I wish I'd had.<\u002Fspan>\"<\u002Fp>\n      <p class=\"bio\">Sukhi spent 20+ years building a digital product and design agency — through all of it: fast growth, difficult years, a merger, un-merged and an exit. He's seen what works commercially in agencies and what looks good in decks but doesn't survive contact with reality.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- [04] SERVICES -->\n<section class=\"container\" id=\"services\" style=\"padding: 55px 40px 0px\">\n  <div class=\"section-head\" data-reveal=\"\">\n    <h2>How we work together<span style=\"color:var(--lime)\">.<\u002Fspan><\u002Fh2>\n    <div class=\"ref\">Three services · One clear journey<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"section-intro\" data-reveal=\"\">Start with the diagnosis. Build the system. Stay close if you need us. <span class=\"lime-fill\">Most founders begin with a Chaos Scan<\u002Fspan> — and take it from there.<\u002Fp>\n\n  <div class=\"svc\">\n    <!-- SERVICE 01 — CHAOS SCAN -->\n    <div class=\"service\" data-reveal=\"\" style=\"border-radius: 5px\">\n      <div class=\"left\">\n        <div class=\"num\">[ Service 01 ]<\u002Fdiv>\n        <h3>Chaos Scan<\u002Fh3>\n        <div class=\"sub\">Diagnostic workshop<\u002Fdiv>\n        <p class=\"tagline\">Find what's actually broken. <span class=\"lime-fill\">Before<\u002Fspan> you spend time fixing the wrong thing.<\u002Fp>\n        <div class=\"body\">\n          <p>A half-day to full-day working session — structured, practical, and honest. We go through your proposition, your pipeline, your positioning, your proof, and how demand really happens in your business. You come out with a Signal Score, a clear view of where the friction is, and a prioritised set of things to fix.<\u002Fp>\n          <p>It's not a comfortable session. It shouldn't be. But it's the one thing that makes everything after it faster and more accurate.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"label\">[ What's included ]<\u002Fdiv>\n        <ul>\n          <li>Commercial health diagnostic across 8 key areas<\u002Fli>\n          <li>Client &amp; lost client interviews, why did they choose or not choose you.<\u002Fli>\n          <li>Pipeline and founder dependency mapping<\u002Fli>\n          <li>Signal Score rating — with score bands<\u002Fli>\n          <li>Priority action plan for the next 90 days<\u002Fli>\n          <li>Written summary and recommended next step<\u002Fli>\n        <\u002Ful>\n        <div class=\"format\"><strong>Format:<\u002Fstrong> Half day or full day · In person or remote<\u002Fdiv>\n        <a class=\"btn btn-ink\" href=\"#contact\" style=\"margin-top: 12px; align-self: flex-start;\">Book a 15-min call →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SERVICE 02 — CALM ENGINE -->\n    <div class=\"service\" data-reveal=\"\" data-reveal-delay=\"1\" style=\"border-radius: 5px\">\n      <div class=\"left\">\n        <div class=\"num\">[ Service 02 ]<\u002Fdiv>\n        <h3>Calm Engine<\u002Fh3>\n        <div class=\"sub\">The build phase<\u002Fdiv>\n        <p class=\"tagline\">A bespoke commercial system your team <span class=\"lime-fill\">actually owns<\u002Fspan> and can run.<\u002Fp>\n        <div class=\"body\">\n          <p>This is where the work happens. Based on the Chaos Scan findings, we build the commercial infrastructure your business needs — proposition, positioning, messaging, pipeline process, qualification, nurture, and the rhythm of accountability around it.<\u002Fp>\n          <p>Not a strategy document. Not a framework. A working system, built for your team, with your team. By the time we're done, it doesn't need us to keep running.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"label\">[ What's included ]<\u002Fdiv>\n        <ul>\n          <li>Proposition clarity and market positioning<\u002Fli>\n          <li>Messaging that the whole team can use<\u002Fli>\n          <li>Pipeline design and qualification criteria<\u002Fli>\n          <li>Outreach, nurture, and follow-up process<\u002Fli>\n          <li>CRM approach and reporting rhythm<\u002Fli>\n          <li>Proof structure — case studies, credentials, credentials in use<\u002Fli>\n          <li>Handover and internal training for the team<\u002Fli>\n        <\u002Ful>\n        <div class=\"format\"><strong>Format:<\u002Fstrong> Fixed-term engagement · Bespoke to the diagnosis<\u002Fdiv>\n        <a class=\"btn btn-ink\" href=\"#contact\" style=\"margin-top: 12px; align-self: flex-start;\">Request more info →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SERVICE 03 — CLEAR RUN -->\n    <div class=\"service\" data-reveal=\"\" data-reveal-delay=\"2\" style=\"border-radius: 5px\">\n      <div class=\"left\">\n        <div class=\"num\">[ Service 03 ]<\u002Fdiv>\n        <h3>Clear Run<\u002Fh3>\n        <div class=\"sub\">Ongoing partnership<\u002Fdiv>\n        <p class=\"tagline\">Close enough to be useful. <span class=\"lime-fill\">Not<\u002Fspan> close enough to create dependency.<\u002Fp>\n        <div class=\"body\">\n          <p>Some founders want a thinking partner long-term — someone who knows the business, challenges the assumptions, and calls out what's starting to slip before it becomes a problem. Clear Run is that relationship.<\u002Fp>\n          <p>A monthly retainer. Structured around what you actually need — not a standing report or a regular call with no agenda. We stay in the picture enough to be genuinely useful. Not so much that we become the problem we were hired to solve.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"right\">\n        <div class=\"label\">[ What's included ]<\u002Fdiv>\n        <ul>\n          <li>Monthly commercial review and challenge session<\u002Fli>\n          <li>Proposition and positioning sense-checks<\u002Fli>\n          <li>Pipeline health and conversion review<\u002Fli>\n          <li>Sounding board for pitches, proposals, and new opportunities<\u002Fli>\n          <li>Async input between sessions when it matters<\u002Fli>\n          <li>Annual strategic review<\u002Fli>\n        <\u002Ful>\n        <div class=\"format\"><strong>Format:<\u002Fstrong> Monthly retainer · Minimum 3-month commitment<\u002Fdiv>\n        <a class=\"btn btn-ink\" href=\"#contact\" style=\"margin-top: 12px; align-self: flex-start;\">Request more info →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SIGNAL STRIP -->\n<section class=\"signal\" data-reveal=\"\" style=\"background-color: rgb(200, 255, 60)\">\n  <div class=\"signal-inner\">\n    <h3>Growth feels harder when the market <span class=\"lime-fill\" style=\"background-color: rgb(255, 255, 255); padding: 0px 6.438px\">can't read you<\u002Fspan> clearly.<\u002Fh3>\n    <div class=\"right\">\n      <p>The goal is not more noise. It's a stronger signal. A Chaos Scan takes half a day and tells you exactly where the friction is. Most founders find it's the clearest picture they've had of their own business.<\u002Fp>\n      <a class=\"btn btn-ink\" href=\"#contact\">Book a Chaos Scan →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section class=\"container\" id=\"contact\" style=\"padding: 55px 40px 0px\">\n  <div class=\"section-head\" data-reveal=\"\">\n    <h2>Let's find the problem<span style=\"color:var(--lime)\">.<\u002Fspan><\u002Fh2>\n    <div class=\"ref\">Start with a conversation<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p class=\"section-intro\" data-reveal=\"\">Tell us a little about where you are. We'll be straight with you about whether we're the right fit — and if we are, <span class=\"lime-fill\">we'll move quickly<\u002Fspan>.<\u002Fp>\n\n  <div class=\"contact-grid\">\n    <div class=\"contact-meta\" data-reveal=\"\">\n      <p class=\"pre\" style=\"margin-bottom: 6px;\">Most engagements start with a Chaos Scan. It's a fixed scope, a clear output, and a low-risk way to find out exactly what needs to change.<\u002Fp>\n\n      <div class=\"row\" style=\"margin-top: 24px;\">\n        <span class=\"label\">Email<\u002Fspan>\n        <div class=\"value\"><a href=\"mailto:hello@chaosover.com\">hello@chaosover.co.uk<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\">\n        <span class=\"label\">LinkedIn<\u002Fspan>\n        <div class=\"value\"><a href=\"#\" target=\"_blank\" rel=\"noopener\">Sukhi Dehal<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\" style=\"border-bottom: 0;\">\n        <span class=\"label\">Response time<\u002Fspan>\n        <div class=\"value\">Within 24 hours<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <form class=\"contact-form\" data-reveal=\"\" data-reveal-delay=\"1\" onsubmit=\"event.preventDefault(); this.querySelector('button').textContent = '✓ Sent — we reply within 24 hours';\" style=\"padding: 0px 0px 15px\">\n      <div class=\"field\">\n        <label for=\"cf-name\">Your name<\u002Flabel>\n        <input id=\"cf-name\" type=\"text\" required=\"\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"cf-agency\">Your agency<\u002Flabel>\n        <input id=\"cf-agency\" type=\"text\" required=\"\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"cf-email\">Email<\u002Flabel>\n        <input id=\"cf-email\" type=\"email\" required=\"\">\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"cf-problem\">What's the most pressing problem right now?<\u002Flabel>\n        <select id=\"cf-problem\" required=\"\">\n          <option value=\"\" disabled=\"\" selected=\"\">Pick one<\u002Foption>\n          <option>Pipeline is inconsistent — good months and bad months<\u002Foption>\n          <option>Growth is too dependent on me as the founder<\u002Foption>\n          <option>Our proposition is unclear — we say different things to different people<\u002Foption>\n          <option>We're pitching but not converting<\u002Foption>\n          <option>We've grown but new business hasn't kept up<\u002Foption>\n          <option>I'm not sure — I just know something's off<\u002Foption>\n        <\u002Fselect>\n      <\u002Fdiv>\n      <div class=\"field\">\n        <label for=\"cf-notes\">Anything else we should know?<\u002Flabel>\n        <textarea id=\"cf-notes\" placeholder=\"Optional\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <button type=\"submit\">Send it over →<\u002Fbutton>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer class=\"foot\" style=\"background: transparent;\">\n  <div style=\"font-family: 'Big Shoulders Display'; font-weight: 900; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); text-transform: none;\">Chaos Over<span style=\"color:var(--lime);\">.<\u002Fspan><\u002Fdiv>\n  <div>Commercial strategy for agency founders · Built from 20 years in the room<\u002Fdiv>\n  <div>© 2026 · CHAOSOVER.CO.UK<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<script src=\"38a2c040-35c6-45d6-a7e1-bec636f9e0e6\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"

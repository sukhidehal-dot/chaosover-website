<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chaos Over.</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="co-soft.css" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: var(--bone);
    overflow: hidden;
    position: relative;
  }

  /* ——— DRIFTING GRADIENT GROUND ———
     Two oversized radial layers that breathe + drift in opposing slow loops.
     Keeps the page feeling alive without competing with the wordmark. */
  .ground {
    position: fixed; inset: -20vh -10vw -20vh -10vw;
    pointer-events: none; z-index: 0;
    background: #f9f3ea;
  }
  .ground::before, .ground::after {
    content: ''; position: absolute; inset: 0;
    background-repeat: no-repeat;
  }
  .ground::before {
    background:
      radial-gradient(60% 55% at 88% 8%, #e6dcf3 0%, rgba(230,220,243,0) 65%),
      radial-gradient(55% 50% at 12% 92%, #fbe2e9 0%, rgba(251,226,233,0) 65%);
    animation: drift-a 38s ease-in-out infinite alternate;
  }
  .ground::after {
    background:
      radial-gradient(45% 40% at 30% 22%, #fbeede 0%, rgba(251,238,222,0) 70%),
      radial-gradient(50% 45% at 80% 78%, #d9e6f3 0%, rgba(217,230,243,0) 70%);
    animation: drift-b 52s ease-in-out infinite alternate;
    mix-blend-mode: multiply;
    opacity: 0.85;
  }
  @keyframes drift-a {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(-3vw, 2vh, 0) scale(1.06); }
    100% { transform: translate3d(2vw, -3vh, 0) scale(1.02); }
  }
  @keyframes drift-b {
    0%   { transform: translate3d(0, 0, 0) scale(1.04); }
    50%  { transform: translate3d(3vw, -2vh, 0) scale(1); }
    100% { transform: translate3d(-2vw, 3vh, 0) scale(1.08); }
  }

  /* ——— GRAIN ———
     SVG noise overlay, very low opacity, animates X/Y in tiny steps for a
     barely-there shimmer. */
  .grain {
    position: fixed; inset: -50%; width: 200%; height: 200%;
    pointer-events: none; z-index: 1;
    opacity: 0.18; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.11  0 0 0 0 0.09  0 0 0 0 0.13  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain 8s steps(8) infinite;
  }
  @keyframes grain {
    0%   { transform: translate(0,0); }
    12%  { transform: translate(-2%, 1%); }
    25%  { transform: translate(1%, -2%); }
    37%  { transform: translate(-1%, -1%); }
    50%  { transform: translate(2%, 2%); }
    62%  { transform: translate(-2%, -1%); }
    75%  { transform: translate(1%, 2%); }
    87%  { transform: translate(-1%, 1%); }
    100% { transform: translate(0,0); }
  }

  /* ——— SHELL ——— */
  .meta-strip, main, footer.foot { position: relative; z-index: 2; }

  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 60px 40px;
  }

  /* ——— HERO ——— */
  .hero {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(28px, 4vw, 56px);
    text-align: center;
  }

  /* Eyebrow stamp above the mark */
  .stamp {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    animation: fade-in 1.4s 0.2s ease-out forwards;
  }
  .stamp .pulse {
    display: inline-block; width: 7px; height: 7px; border-radius: 999px;
    background: var(--lime);
    box-shadow: 0 0 0 0 rgba(200,255,61,0.6);
    animation: pulse 3.2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(200,255,61,0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(200,255,61,0); }
    100% { box-shadow: 0 0 0 0 rgba(200,255,61,0); }
  }

  /* The mark itself */
  .mark {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(120px, 19vw, 320px);
    line-height: 0.84;
    letter-spacing: -0.03em;
    color: var(--ink);
    position: relative;
  }
  .mark .row {
    display: block;
    position: relative;
    overflow: visible;
  }
  .mark .word {
    display: inline-block;
    position: relative;
    transform: translateY(110%);
    animation: rise 1.2s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .mark .row:nth-child(1) .word { animation-delay: 0.45s; }
  .mark .row:nth-child(2) .word { animation-delay: 0.62s; }
  @keyframes rise {
    to { transform: translateY(0); }
  }

  /* Strike-through — draws across after each word lands */
  .mark .word::after {
    content: ''; position: absolute;
    left: -6%; right: -6%; top: 72%;
    height: 0.045em; background: var(--lime);
    transform: translateY(-50%) rotate(-39deg) scaleX(0);
    transform-origin: left center;
    animation: strike 0.7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .mark .row:nth-child(1) .word::after { animation-delay: 1.2s; }
  .mark .row:nth-child(2) .word::after { animation-delay: 1.4s; }
  @keyframes strike {
    from { transform: translateY(-50%) rotate(-39deg) scaleX(0); }
    to   { transform: translateY(-50%) rotate(-39deg) scaleX(1); }
  }

  /* The dot */
  .mark .dot {
    color: var(--lime);
    display: inline-block;
    transform: scale(0);
    transform-origin: center;
    animation: pop 0.6s cubic-bezier(.34,1.56,.64,1) 1.7s forwards,
               breathe 4.5s ease-in-out 2.3s infinite;
  }
  @keyframes pop {
    to { transform: scale(1); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.55; }
  }

  /* mask layer so the rising words don't leak above their row */
  .mark .row { clip-path: inset(-0.05em -10% -0.02em -10%); }
  .mark .row.tail { clip-path: none; } /* row with the dot needs to spill */

  /* ——— TAGLINE ——— */
  .tagline {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 2.4vw, 36px);
    line-height: 1.15; letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 720px;
    opacity: 0;
    animation: fade-up 1.4s 2.1s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .tagline .alt {
    color: var(--ink-soft);
    font-weight: 600;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade-in {
    to { opacity: 1; }
  }

  /* ——— META STRIP ——— */
  .meta-strip {
    opacity: 0;
    animation: fade-in 1.4s 0.1s ease-out forwards;
  }
  .meta-strip .dot-strip {
    display: inline-block; width: 6px; height: 6px; border-radius: 999px;
    background: var(--lime); vertical-align: middle; margin: 0 4px;
    box-shadow: inset 0 0 0 0.5px var(--ink);
  }

  /* ——— FOOTER ——— */
  footer.foot {
    border-top: 1px solid var(--line);
    opacity: 0;
    animation: fade-in 1.6s 2.4s ease-out forwards;
  }
  footer.foot .left, footer.foot .right { display: flex; gap: 22px; align-items: center; }
  footer.foot .sep { opacity: 0.45; }

  /* mouse-parallax wrapper (subtle) */
  .parallax {
    transition: transform 0.6s cubic-bezier(.2,.7,.3,1);
    will-change: transform;
  }

  @media (max-width: 720px) {
    .mark { font-size: clamp(80px, 22vw, 160px); }
    .tagline { font-size: 20px; }
    main { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="ground"></div>
<div class="grain"></div>

<div class="meta-strip">
  <div>CO/BRAND <span class="dot-strip"></span> COMMERCIAL ENGINES DESIGNED AROUND PEOPLE</div>
  <div>EST. 2026 · LONDON, UK</div>
</div>

<main>
  <div class="parallax" id="parallax">
    <div class="hero">
      <div class="stamp"><span class="pulse"></span> Chaos Over — Index 00 / Manifest</div>

      <h1 class="mark" aria-label="Chaos Over.">
        <span class="row"><span class="word">CHAOS</span></span>
        <span class="row tail"><span class="word">OVER</span><span class="dot">.</span></span>
      </h1>

      <p class="tagline">The pattern was <span class="alt">always</span> there.</p>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="left">
    <span>[ Index 00 ]</span>
    <span class="sep">/</span>
    <span>Manifest</span>
  </div>
  <div class="right">
    <span>● Signal received</span>
    <span class="sep">/</span>
    <span>v1.0 · 2026</span>
  </div>
</footer>

<script>
  // Very subtle mouse parallax on the whole hero group.
  // Keeps the mark feeling anchored but breathing with the cursor.
  (function () {
    const el = document.getElementById('parallax');
    if (!el) return;
    let tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('mousemove', (e) => {
      tx = (e.clientX / window.innerWidth  - 0.5) * 10;  // ±5px
      ty = (e.clientY / window.innerHeight - 0.5) * 8;   // ±4px
    });
    function tick() {
      cx += (tx - cx) * 0.04;
      cy += (ty - cy) * 0.04;
      el.style.transform = `translate3d(${cx}px, ${cy}px, 0)`;
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>

</body>
</html>

<style>
  /* ——— TOKENS ——— */
  :root {
    --ink: #1c1822;
    --ink-soft: rgba(28,24,34,0.65);
    --ink-dim: rgba(28,24,34,0.45);
    --bone: #f4eee2;
    --bone-2: #ede5d4;
    --lime: #c8ff3d;
    --line: rgba(28,24,34,0.14);
    --line-strong: rgba(28,24,34,0.22);
    /* Strip heights — used to calculate main clearance */
    --strip-h: 47px;
    --foot-h:  76px;
  }

  /* ——— RESET ——— */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100vh;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    background: var(--bone);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    position: relative;
  }
  a { color: inherit; text-decoration: none; }

  /* ——— DRIFTING GRADIENT GROUND ———
     Expanded from inset shorthand for Safari < 14.1 compatibility.
     Two radial layers on mismatched 38s/52s loops — they never sync. */
  .ground {
    position: fixed;
    top: -20vh; right: -10vw; bottom: -20vh; left: -10vw; /* inset expanded */
    pointer-events: none;
    z-index: 0;
    background: #f9f3ea;
  }
  .ground::before,
  .ground::after {
    content: '';
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0; /* inset: 0 expanded */
    background-repeat: no-repeat;
  }
  .ground::before {
    background:
      radial-gradient(60% 55% at 88%  8%, #e6dcf3 0%, rgba(230,220,243,0) 65%),
      radial-gradient(55% 50% at 12% 92%, #fbe2e9 0%, rgba(251,226,233,0) 65%);
    -webkit-animation: drift-a 38s ease-in-out infinite alternate;
            animation: drift-a 38s ease-in-out infinite alternate;
  }
  .ground::after {
    background:
      radial-gradient(45% 40% at 30% 22%, #fbeede 0%, rgba(251,238,222,0) 70%),
      radial-gradient(50% 45% at 80% 78%, #d9e6f3 0%, rgba(217,230,243,0) 70%);
    -webkit-animation: drift-b 52s ease-in-out infinite alternate;
            animation: drift-b 52s ease-in-out infinite alternate;
    mix-blend-mode: multiply;
    opacity: 0.85;
  }
  @-webkit-keyframes drift-a {
    0%   { -webkit-transform: translate3d(0,0,0) scale(1);           transform: translate3d(0,0,0) scale(1); }
    50%  { -webkit-transform: translate3d(-3vw,2vh,0) scale(1.06);   transform: translate3d(-3vw,2vh,0) scale(1.06); }
    100% { -webkit-transform: translate3d(2vw,-3vh,0) scale(1.02);   transform: translate3d(2vw,-3vh,0) scale(1.02); }
  }
  @keyframes drift-a {
    0%   { transform: translate3d(0,0,0) scale(1); }
    50%  { transform: translate3d(-3vw,2vh,0) scale(1.06); }
    100% { transform: translate3d(2vw,-3vh,0) scale(1.02); }
  }
  @-webkit-keyframes drift-b {
    0%   { -webkit-transform: translate3d(0,0,0) scale(1.04);        transform: translate3d(0,0,0) scale(1.04); }
    50%  { -webkit-transform: translate3d(3vw,-2vh,0) scale(1);      transform: translate3d(3vw,-2vh,0) scale(1); }
    100% { -webkit-transform: translate3d(-2vw,3vh,0) scale(1.08);   transform: translate3d(-2vw,3vh,0) scale(1.08); }
  }
  @keyframes drift-b {
    0%   { transform: translate3d(0,0,0) scale(1.04); }
    50%  { transform: translate3d(3vw,-2vh,0) scale(1); }
    100% { transform: translate3d(-2vw,3vh,0) scale(1.08); }
  }

  /* ——— GRAIN ———
     charset=utf-8 is the spec-correct MIME param (utf8 is non-standard).
     Special chars (<, >, #) are percent-encoded for reliable cross-browser parsing. */
  .grain {
    position: fixed;
    /* inset: -50% expanded — fixes Safari < 14.1 */
    top: -50%; right: -50%; bottom: -50%; left: -50%;
    width: 200%; height: 200%;
    pointer-events: none;
    z-index: 1;
    opacity: 0.18;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0 0.13 0 0 0 0.55 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    -webkit-animation: grain 8s steps(8) infinite;
            animation: grain 8s steps(8) infinite;
  }
  @-webkit-keyframes grain {
    0%   { -webkit-transform: translate(0,0);    transform: translate(0,0); }
    12%  { -webkit-transform: translate(-2%,1%); transform: translate(-2%,1%); }
    25%  { -webkit-transform: translate(1%,-2%); transform: translate(1%,-2%); }
    37%  { -webkit-transform: translate(-1%,-1%);transform: translate(-1%,-1%); }
    50%  { -webkit-transform: translate(2%,2%);  transform: translate(2%,2%); }
    62%  { -webkit-transform: translate(-2%,-1%);transform: translate(-2%,-1%); }
    75%  { -webkit-transform: translate(1%,2%);  transform: translate(1%,2%); }
    87%  { -webkit-transform: translate(-1%,1%); transform: translate(-1%,1%); }
    100% { -webkit-transform: translate(0,0);    transform: translate(0,0); }
  }
  @keyframes grain {
    0%   { transform: translate(0,0); }
    12%  { transform: translate(-2%,1%); }
    25%  { transform: translate(1%,-2%); }
    37%  { transform: translate(-1%,-1%); }
    50%  { transform: translate(2%,2%); }
    62%  { transform: translate(-2%,-1%); }
    75%  { transform: translate(1%,2%); }
    87%  { transform: translate(-1%,1%); }
    100% { transform: translate(0,0); }
  }

  /* ——— FIXED META STRIP (top) ———
     Solid bone fallback first, then backdrop-filter on top for supporting browsers.
     env() safe-area insets keep content clear of iPhone notch / Dynamic Island. */
  .meta-strip {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    /* Solid fallback for browsers without backdrop-filter */
    background: var(--bone);
    /* Translucent + blur for supporting browsers — overrides solid above */
    background: rgba(244,238,226,0.88);
    -webkit-backdrop-filter: blur(8px) saturate(1.4);
            backdrop-filter: blur(8px) saturate(1.4);
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    /* Safe-area-aware padding: falls back to fixed values on non-notched devices */
    padding-top: max(14px, env(safe-area-inset-top, 0px));
    padding-bottom: 14px;
    padding-left: max(40px, env(safe-area-inset-left, 0px));
    padding-right: max(40px, env(safe-area-inset-right, 0px));
    border-bottom: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    -webkit-animation: fade-in 1.4s 0.1s ease-out forwards;
            animation: fade-in 1.4s 0.1s ease-out forwards;
  }
  /* Shrink text on very narrow screens so it wraps gracefully */
  @media (max-width: 480px) {
    .meta-strip { font-size: 9px; letter-spacing: 0.16em; }
  }
  .meta-strip .dot-strip {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 999px;
    background: var(--lime);
    vertical-align: middle;
    margin: 0 6px;
    box-shadow: inset 0 0 0 1px rgba(28,24,34,0.25); /* 1px for non-retina clarity */
  }

  /* ——— MAIN ———
     100px base clearance on each side; safe-area insets push it further on notched phones. */
  main {
    -webkit-box-flex: 1;
    -webkit-flex: 1;
    flex: 1;
    position: relative; z-index: 2;
    display: -ms-grid;
    display: grid;
    place-items: center;
    padding-top: max(100px, calc(80px + env(safe-area-inset-top, 0px)));
    padding-bottom: max(100px, calc(80px + env(safe-area-inset-bottom, 0px)));
    padding-left: 40px;
    padding-right: 40px;
  }

  /* ——— HERO ——— */
  .hero {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: clamp(28px, 4vw, 56px);
    text-align: center;
  }
  /* Flex-gap fallback for Safari < 14.1 */
  @supports not (gap: 1px) {
    .hero > * + * { margin-top: clamp(28px, 4vw, 56px); }
  }

  /* Eyebrow stamp */
  .stamp {
    display: -webkit-inline-box;
    display: -webkit-inline-flex;
    display: inline-flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    -webkit-animation: fade-in 1.4s 0.2s ease-out forwards;
            animation: fade-in 1.4s 0.2s ease-out forwards;
  }
  /* Stamp pulse dot */
  .stamp .pulse {
    display: inline-block; width: 7px; height: 7px; border-radius: 999px;
    background: var(--lime);
    box-shadow: 0 0 0 0 rgba(200,255,61,0.6);
    -webkit-flex-shrink: 0;
    flex-shrink: 0;
    -webkit-animation: pulse 3.2s ease-out infinite;
            animation: pulse 3.2s ease-out infinite;
  }
  @-webkit-keyframes pulse {
    0%   { box-shadow: 0 0 0 0    rgba(200,255,61,0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(200,255,61,0); }
    100% { box-shadow: 0 0 0 0    rgba(200,255,61,0); }
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0    rgba(200,255,61,0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(200,255,61,0); }
    100% { box-shadow: 0 0 0 0    rgba(200,255,61,0); }
  }

  /* ——— WORDMARK ——— */
  .mark {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(120px, 19vw, 320px);
    line-height: 0.84;
    letter-spacing: -0.03em;
    color: var(--ink);
    position: relative;
  }
  .mark .row {
    display: block; position: relative; overflow: visible;
    /* -webkit- prefix for Safari < 13 */
    -webkit-clip-path: inset(-0.05em -10% -0.02em -10%);
            clip-path: inset(-0.05em -10% -0.02em -10%);
  }
  /* Tail row lets the lime dot spill outside the clip region */
  .mark .row.tail {
    -webkit-clip-path: none;
            clip-path: none;
  }
  .mark .word {
    display: inline-block; position: relative;
    -webkit-transform: translateY(110%);
            transform: translateY(110%);
    -webkit-animation: rise 1.2s cubic-bezier(.2,.7,.3,1) forwards;
            animation: rise 1.2s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .mark .row:nth-child(1) .word { -webkit-animation-delay: 0.45s; animation-delay: 0.45s; }
  .mark .row:nth-child(2) .word { -webkit-animation-delay: 0.62s; animation-delay: 0.62s; }
  @-webkit-keyframes rise { to { -webkit-transform: translateY(0); transform: translateY(0); } }
  @keyframes rise         { to { transform: translateY(0); } }

  /* Lime strike — scaleX draws from left after each word lands */
  .mark .word::after {
    content: ''; position: absolute;
    left: -6%; right: -6%; top: 72%;
    height: 0.045em; background: var(--lime);
    -webkit-transform: translateY(-50%) rotate(-39deg) scaleX(0);
            transform: translateY(-50%) rotate(-39deg) scaleX(0);
    -webkit-transform-origin: left center;
            transform-origin: left center;
    -webkit-animation: strike 0.7s cubic-bezier(.2,.7,.3,1) forwards;
            animation: strike 0.7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .mark .row:nth-child(1) .word::after { -webkit-animation-delay: 1.2s; animation-delay: 1.2s; }
  .mark .row:nth-child(2) .word::after { -webkit-animation-delay: 1.4s; animation-delay: 1.4s; }
  @-webkit-keyframes strike {
    from { -webkit-transform: translateY(-50%) rotate(-39deg) scaleX(0); transform: translateY(-50%) rotate(-39deg) scaleX(0); }
    to   { -webkit-transform: translateY(-50%) rotate(-39deg) scaleX(1); transform: translateY(-50%) rotate(-39deg) scaleX(1); }
  }
  @keyframes strike {
    from { transform: translateY(-50%) rotate(-39deg) scaleX(0); }
    to   { transform: translateY(-50%) rotate(-39deg) scaleX(1); }
  }

  /* Lime dot — spring pop, then breathes forever */
  .mark .dot {
    color: var(--lime);
    display: inline-block;
    -webkit-transform: scale(0);
            transform: scale(0);
    -webkit-transform-origin: center;
            transform-origin: center;
    -webkit-animation:
      pop     0.6s cubic-bezier(.34,1.56,.64,1) 1.7s forwards,
      breathe 4.5s ease-in-out 2.3s infinite;
    animation:
      pop     0.6s cubic-bezier(.34,1.56,.64,1) 1.7s forwards,
      breathe 4.5s ease-in-out 2.3s infinite;
  }
  @-webkit-keyframes pop     { to { -webkit-transform: scale(1); transform: scale(1); } }
  @keyframes pop             { to { transform: scale(1); } }
  @-webkit-keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @keyframes breathe         { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* ——— TAGLINE ——— */
  .tagline {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 700;
    font-size: clamp(22px, 2.4vw, 36px);
    line-height: 1.15; letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 720px;
    opacity: 0;
    -webkit-animation: fade-up 1.4s 2.1s cubic-bezier(.2,.7,.3,1) forwards;
            animation: fade-up 1.4s 2.1s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .tagline .alt { color: var(--ink-soft); font-weight: 600; }

  /* ——— SHARED KEYFRAMES ——— */
  @-webkit-keyframes fade-up {
    from { opacity: 0; -webkit-transform: translateY(14px); transform: translateY(14px); }
    to   { opacity: 1; -webkit-transform: translateY(0);    transform: translateY(0); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @-webkit-keyframes fade-in { to { opacity: 1; } }
  @keyframes fade-in         { to { opacity: 1; } }

  /* ——— FIXED FOOTER (bottom) ———
     Same solid→blur pattern as the strip. Safe-area inset for home-bar on iPhone. */
  footer.foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--bone); /* solid fallback */
    background: rgba(244,238,226,0.88);
    -webkit-backdrop-filter: blur(8px) saturate(1.4);
            backdrop-filter: blur(8px) saturate(1.4);
    border-top: 1px solid var(--line);
    padding-top: 28px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
    padding-left: max(40px, env(safe-area-inset-left, 0px));
    padding-right: max(40px, env(safe-area-inset-right, 0px));
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-pack: justify;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0;
    -webkit-animation: fade-in 1.6s 2.4s ease-out forwards;
            animation: fade-in 1.6s 2.4s ease-out forwards;
  }
  footer.foot .left,
  footer.foot .right {
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    gap: 22px;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
  }
  /* Flex-gap fallback */
  @supports not (gap: 1px) {
    footer.foot .left > * + *,
    footer.foot .right > * + * { margin-left: 22px; }
  }
  footer.foot .sep { opacity: 0.45; }

  /* ——— PARALLAX WRAPPER ——— */
  .parallax {
    -webkit-transition: -webkit-transform 0.6s cubic-bezier(.2,.7,.3,1);
            transition: transform 0.6s cubic-bezier(.2,.7,.3,1);
    will-change: transform;
  }

  /* ——— RESPONSIVE ——— */
  @media (max-width: 720px) {
    .mark    { font-size: clamp(80px, 22vw, 160px); }
    .tagline { font-size: 20px; }
    main     { padding-left: 24px; padding-right: 24px; }
    .meta-strip,
    footer.foot {
      padding-left:  max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px));
    }
  }

  /* ——— REDUCED MOTION ———
     All entry animations skip to final state. Drift and grain freeze.
     Parallax is disabled in JS. Breathe/pulse loops slow to 8s. */
  @media (prefers-reduced-motion: reduce) {
    .ground::before,
    .ground::after  { -webkit-animation: none; animation: none; }
    .grain          { -webkit-animation: none; animation: none; }

    .meta-strip,
    footer.foot     { opacity: 1; -webkit-animation: none; animation: none; }

    .stamp          { opacity: 1; -webkit-animation: none; animation: none; }
    .stamp .pulse   {
      -webkit-animation: pulse-slow 8s ease-out infinite;
              animation: pulse-slow 8s ease-out infinite;
    }

    .mark .word {
      -webkit-transform: translateY(0); transform: translateY(0);
      -webkit-animation: none; animation: none;
    }
    .mark .word::after {
      -webkit-transform: translateY(-50%) rotate(-39deg) scaleX(1);
              transform: translateY(-50%) rotate(-39deg) scaleX(1);
      -webkit-animation: none; animation: none;
    }
    .mark .dot {
      -webkit-transform: scale(1); transform: scale(1);
      -webkit-animation: breathe-slow 8s ease-in-out infinite;
              animation: breathe-slow 8s ease-in-out infinite;
    }

    .tagline { opacity: 1; -webkit-transform: none; transform: none; -webkit-animation: none; animation: none; }
  }
  @-webkit-keyframes breathe-slow { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
  @keyframes breathe-slow         { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
  @-webkit-keyframes pulse-slow {
    0%   { box-shadow: 0 0 0 0    rgba(200,255,61,0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(200,255,61,0); }
    100% { box-shadow: 0 0 0 0    rgba(200,255,61,0); }
  }
  @keyframes pulse-slow {
    0%   { box-shadow: 0 0 0 0    rgba(200,255,61,0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(200,255,61,0); }
    100% { box-shadow: 0 0 0 0    rgba(200,255,61,0); }
  }
</style>
</head>
<body>

<div class="ground"></div>
<div class="grain"></div>

<div class="meta-strip" role="banner">
  <div>CO/BRAND <span class="dot-strip" aria-hidden="true"></span> BESPOKE COMMERCIAL ENGINES DESIGNED AROUND PEOPLE AND THE THINGS THEY SELL</div>
</div>

<main>
  <div class="parallax" id="parallax">
    <div class="hero">
      <div class="stamp" aria-hidden="true"><span class="pulse"></span> Chaos Over — Index 00 / Manifest</div>

      <h1 class="mark" aria-label="Chaos Over.">
        <span class="row"><span class="word">CHAOS</span></span>
        <span class="row tail"><span class="word">OVER</span><span class="dot" aria-hidden="true">.</span></span>
      </h1>

      <p class="tagline">The pattern was <span class="alt">always</span> there.</p>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="left">
    <span>[ Index 00 ]</span>
    <span class="sep" aria-hidden="true">/</span>
    <span>Manifest</span>
  </div>
  <div class="right">
    <span>Est. 2026</span>
    <span class="sep" aria-hidden="true">/</span>
    <span>London, UK</span>
  </div>
</footer>

<script>
  /* Mouse parallax — very damped (0.04 lerp) so it feels anchored, not twitchy.
     Skipped entirely when prefers-reduced-motion is set. */
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var el = document.getElementById('parallax');
    if (!el) return;
    var tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('mousemove', function (e) {
      tx = (e.clientX / window.innerWidth  - 0.5) * 10;
      ty = (e.clientY / window.innerHeight - 0.5) * 8;
    });
    function tick() {
      cx += (tx - cx) * 0.04;
      cy += (ty - cy) * 0.04;
      el.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }());
</script>

</body>
